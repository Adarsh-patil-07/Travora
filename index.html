<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="Travora — Discover places worth remembering. Explore destinations, check live weather, and plan your trip with AI." />
    <meta name="theme-color" content="#F7F6F2" />

    <!-- Google Fonts: Playfair Display + Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Web App Manifest & Icons -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/icon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Travora" />

    <!-- Open Graph / Social Media Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://travora-ai.netlify.app/" />
    <meta property="og:title" content="Travora — Discover Places Worth Remembering" />
    <meta property="og:description" content="Explore destinations, check live weather, and plan your trip with AI." />
    <meta property="og:image" content="https://travora-ai.netlify.app/preview.jpg" />
    <meta property="og:image:alt" content="Travora App Preview" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://travora-ai.netlify.app/" />
    <meta name="twitter:title" content="Travora — Discover Places Worth Remembering" />
    <meta name="twitter:description" content="Explore destinations, check live weather, and plan your trip with AI." />
    <meta name="twitter:image" content="https://travora-ai.netlify.app/preview.jpg" />

    <title>Travora — Discover Places Worth Remembering</title>
  </head>
  <body>
    <div id="root"></div>
    <div id="google_translate_element" style="display:none;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'en', includedLanguages: 'en,es,fr,zh-CN,de', autoDisplay: false}, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <script type="module" src="/src/main.tsx"></script>
